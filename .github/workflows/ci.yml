name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    # Without a deadline GitHub's default of 360 applies, so anything that hangs
    # costs six hours rather than twenty minutes looking like work in progress.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Turbo's own cache. Without it every run rebuilds work it has already
      # done, and `build` is the slowest task here.
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # Build first. `@lime-soda/tokens` is generated — Style Dictionary writes
      # its only artefacts — so a package importing `@lime-soda/tokens/<name>`
      # cannot be typechecked until they exist. Turbo runs each package's own
      # typecheck and check in dependency order on the way.
      - run: pnpm build

      # Then the whole repo in one pass, which also covers the files that belong
      # to no package: the root config, the workflow, the docs.
      - run: pnpm check

      # Everything that does not need a browser. The rest is a job of its own,
      # below, because only that part needs anything unusual to run.
      - run: pnpm test:node

      # Budgets, not timings: these catch an order-of-magnitude regression such
      # as a lost memo or a retained element, not a few ms of runner noise.
      - run: pnpm bench:node

  # The browser half, and nothing else.
  #
  # This is the only job that needs Chromium, so it is the only one that pays
  # for it. Putting the whole of `verify` in the image meant every step ran as
  # root inside a container — which is where the git ownership warnings and the
  # HOME override came from, none of which has anything to do with running a
  # browser.
  browser:
    name: Browser tests
    needs: verify
    runs-on: ubuntu-latest

    # Playwright's own image, which already has Chromium and every system
    # library it needs. Installing them per run is what hung for four hours:
    # `--with-deps` shells out to apt, and apt waiting on something has no
    # deadline of its own.
    #
    # The tag must match the Playwright version pnpm-lock.yaml resolves to, or
    # the browsers in the image are not the builds the tests look for.
    container: mcr.microsoft.com/playwright:v1.62.1-noble

    # Stated again, though the image sets it too. A job step does not inherit
    # the image's ENV: Actions builds the step environment itself and overrides
    # HOME to /github/home, so Playwright looked in $HOME/.cache/ms-playwright,
    # found nothing, and asked us to install browsers already in the image.
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The container runs as root and the checkout is not root's, so git
      # refuses the repository — "dubious ownership". Nothing fails outright:
      # turbo cannot run `git diff`, warns, and falls back to a weaker cache
      # key, which is the sort of thing that quietly stops working.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Restores what `verify` built, so the build these depend on is a cache
      # hit rather than a second full one.
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm test:browser
      - run: pnpm bench:browser

  # Visual regression. Runs after verify so a broken build does not burn
  # snapshots, and on both PRs and main so Chromatic has a baseline to diff.
  chromatic:
    name: Chromatic
    timeout-minutes: 20
    needs: [verify, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Chromatic needs history to find the ancestor build to compare with.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm build

      # Pinned, not `@latest`: this is the job that holds the Chromatic token,
      # and a floating tag means an upstream push runs with it unreviewed.
      # Renovate can offer the bumps now that there is a version to compare.
      - uses: chromaui/action@v18.1.0
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: support/storybook
          buildScriptName: build
          exitZeroOnChanges: true

  # Only after `verify`, and only on main. Previously this was a second workflow
  # racing the first, so a release could be cut from a commit whose tests had
  # not finished — or had failed.
  release:
    name: Release
    timeout-minutes: 20
    needs: [verify, browser]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # Node 24 is load-bearing here, not just current: OIDC trusted publishing
      # needs npm >= 11.5.1 and Node 24 bundles 11.17. Node 22 still ships
      # npm 10.9, where the publish does not error on the version — it falls
      # back to wanting a token and fails on authentication instead.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Restores what `verify` just built, so this is a cache hit rather than a
      # second full build.
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm build

      # Opens a "Version Packages" PR while changesets are pending, and
      # publishes once that PR is merged. Nothing happens until a changeset
      # exists, so an ordinary commit to main is a no-op here.
      - uses: changesets/action@v2.1.0
        with:
          # Changesets rewrites code fences in the changelog with its own
          # defaults, which disagree with ours — so the generated file failed
          # the format check and, because release waits on verify, blocked its
          # own publish. Formatting here means what it commits already passes.
          #
          # A script rather than two commands: this input is not run through a
          # shell, so `changeset version && pnpm format` was handed to changesets
          # as arguments, it refused the lot, and the action pushed an
          # unversioned branch anyway.
          #
          # v2 renamed all four of these. The old names are not merely ignored:
          # the action fails outright when it sees them, so a release cannot be
          # cut until they are updated.
          version-script: pnpm run changeset:version
          publish-script: pnpm run release
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
        env:
          # No npm credentials: the registry authenticates the runner itself
          # through OIDC, which is why `id-token: write` is granted above. That
          # also gets published provenance for free.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
