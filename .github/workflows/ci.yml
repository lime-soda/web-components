name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Component tests drive a real Chromium: the flow layout depends on real
      # measurement and a real IntersectionObserver, so there is nothing useful to
      # assert in jsdom.
      - run: pnpm --filter @flowgrid/core exec playwright install --with-deps chromium

      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

      # Budgets, not timings: these catch an order-of-magnitude regression such
      # as a lost memo or a retained element, not a few ms of runner noise.
      - run: pnpm bench
